[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hybrid-quant-platform"
version = "0.1.0"
description = "Reproducible US equity research demonstration and C++ execution accounting"
requires-python = ">=3.9"
dependencies = ["numpy>=1.23,<3", "pandas>=1.5,<3", "pyarrow>=10", "tzdata>=2024.1"]

[project.optional-dependencies]
example = ["scikit-learn>=1.1", "joblib>=1.2"]
dev = ["pytest>=7"]

[project.scripts]
hybrid-quant = "hybrid_quant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
